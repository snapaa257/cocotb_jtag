adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9999
transport select jtag
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10002FFF
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
init
halt
echo "PC0=[reg pc]"
step
echo "PC1=[reg pc]"
echo "MEM_0x80000000=[read_memory 0x80000000 32 4]"
mww 0x80001000 0xcafebabe
echo "WRITEBACK_0x80001000=[read_memory 0x80001000 32 1]"
resume
shutdown
